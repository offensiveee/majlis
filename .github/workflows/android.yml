name: Android TV app

on:
  push:
    branches: [main]
    paths: ["android/**", "src/**", "scripts/build-android.mjs", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", "src/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy the screen and phone app into the Android assets
        run: node scripts/build-android.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk majlis-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: majlis-android
          path: majlis-android.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: majlis-android.apk
